<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats</title>
    <link rel="canonical" href="https://youngboysgorlice.pl/stats.html" />
{{>base-head}}
    <link rel="stylesheet" href="css/snowfall.css">
    <link href="https://fonts.cdnfonts.com/css/pricedown" rel="stylesheet">
{{>libraries}}
    <script defer src="js/i18n.js"></script>
    <script defer src="js/activePage.js"></script>
    <script defer src="js/logoAnimation.js"></script>
    <script type="module" src="js/clubStats.js"></script>
    <script type="module" src="js/search.js"></script>
{{>analytics}}
</head>
<body style="background-color: black; color: white;">

{{>header}}

    <div class="snowfall"></div>

    <main class="container flex-grow-1">
        <img src="images/ybg-logo.svg" id="logo-brand" alt="YBG logo">
        <h1 data-i18n="navbar.stats"></h1>
        <p data-i18n="statsDesc"></p><br><br>
        <section id="clubStatsSection">

            <h3 data-i18n="clubStatsTitle"></h3>

            <div id="clubStatsCards" class="stats-grid mb-4"></div>

            <div class="row g-4 justify-content-center">
                <div class="col-12 col-md-4">
                    <div class="card bg-dark text-light p-3 h-100">
                        <h5 class="mb-3" data-i18n="chart"></h5>
                        <canvas id="clubStatsChart" height="200"></canvas>
                    </div>
                </div>

                <div id="achievementCard" class="col-12 col-md-6">
                    <div class="card bg-dark text-light p-3 h-100">
                        <h5 class="mb-3" data-i18n="achievements"></h5>
                        <div id="achievementsCard"></div>
                    </div>
                </div>

                <div class="col-12 col-md-4">
                    <div class="card bg-dark text-light p-3 h-100">
                        <h5 class="mb-3" data-i18n="topScorers"></h5>

                        <table class="table table-dark table-striped table-hover table-sm" style="margin-bottom: 0px !important;">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th data-i18n="player"></th>
                                    <th data-i18n="goals"></th>
                                </tr>
                            </thead>
                            <tbody id="clubStatsTableBody"></tbody>
                        </table>
                    </div>
                </div>

            </div>

        </section>

    </main>

{{>footer}}

{{>search-modal}}
</body>
</html>
