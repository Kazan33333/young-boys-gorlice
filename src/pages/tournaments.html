<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournaments</title>
    <link rel="canonical" href="https://youngboysgorlice.pl/tournaments.html" />
{{>base-head}}
    <link rel="stylesheet" href="css/snowfall.css">
    <link href="https://fonts.cdnfonts.com/css/pricedown" rel="stylesheet">
{{>libraries}}
    <script defer src="js/i18n.js"></script>
    <script defer src="js/activePage.js"></script>
    <script type="module" src="js/tournaments.js"></script>
    <script src="js/snowfall.js" defer></script>
    <script type="module" src="js/search.js"></script>
{{>analytics}}
</head>
<body style="background-color: black; color: white;">

{{>header}}

    <div class="snowfall"></div>

    <main class="container flex-grow-1">
        <img src="images/pedestal-podium.svg" id="medalIcon" alt="Medal" 
            style="width: 110px; cursor: pointer; float: right;">
        <a id="pdfLink" href="#" target="_blank" style="float: right; margin-right: 1%;">
            <img src="images/icons8-pdf-transparent.svg" 
                    style="width: 60px; cursor: pointer; user-select: none;">
        </a>
        <h1 data-i18n="navbar.tournaments"></h1>
        <p data-i18n="tournamentsDesc"></p>

        <div class="dropdown mb-4" data-bs-theme="dark">
            <button class="btn btn-dark dropdown-toggle" type="button" id="seasonDropdown" data-bs-toggle="dropdown">
                Wybierz sezon
            </button>
            <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="seasonDropdown">
                <li><a class="dropdown-item" href="javascript:void(0)">Turniej Małego Pola - Gorlice 2019</a></li>
                <li><a class="dropdown-item" href="javascript:void(0)">Turniej Małego Pola - Gorlice 2021</a></li>
                <li><a class="dropdown-item" href="javascript:void(0)">Turniej Futsal - Gorlice 2025</a></li>
                <li><a class="dropdown-item" href="javascript:void(0)">Turniej Małego Pola - Sękowa 2025</a></li>
                <li><a class="dropdown-item" href="javascript:void(0)">Turniej Futsal - Gorlice 2026</a></li>
            </ul>
        </div>

        <table class="table table-hover table-dark table-striped">
            <thead>
                <tr>
                    <th data-i18n="table.date"></th>
                    <th data-i18n="table.match"></th>
                    <th data-i18n="table.score"></th>
                </tr>
            </thead>
            <tbody id="resultsTableBody"></tbody>
        </table>
    </main>

{{>footer}}

{{>results-modal}}

{{>search-modal}}
</body>
</html>
