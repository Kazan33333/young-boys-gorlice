<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Young Boys Gorlice</title>
    <meta name="description" content="Strona o Young Boys Gorlice, gorlicka liga futsal.">
    <link rel="canonical" href="https://youngboysgorlice.pl/" />
{{>base-head}}
    <link rel="stylesheet" href="css/snowfall.css">
    <link href="https://fonts.cdnfonts.com/css/pricedown" rel="stylesheet">
{{>libraries}}
    <script defer src="js/i18n.js"></script>
    <script defer src="js/logoAnimation.js"></script>
    <script src="js/snowfall.js" defer></script>
    <script type="module" src="js/search.js"></script>
{{>analytics}}
</head>
<body style="background-color: black; color: white;">

{{>header}}

    <div class="snowfall"></div>

    <main class="container flex-grow-1">
        <img src="images/ybg-logo.svg" id="logo-brand" alt="YBG logo">
        <h1 data-i18n="homePage"></h1>
        <p data-i18n="homePageDesc"></p><br><br>
        <div class="row g-3">
            <div class="col-12">
                <a href="javascript:void(0)" class="menu-link d-flex text-decoration-none">
                    <div class="col-4 col-md-3 d-flex align-items-center menu-label" data-i18n="search"></div>
                    <div class="col-8 col-md-9 card bg-dark text-light p-3 menu-desc" data-i18n="searchInfo"></div>
                </a>
            </div>

            <div class="col-12">
                <a href="fixtures.html" class="menu-link d-flex text-decoration-none">
                    <div class="col-4 col-md-3 d-flex align-items-center menu-label" data-i18n="navbar.fixtures"></div>
                    <div class="col-8 col-md-9 card bg-dark text-light p-3 menu-desc" data-i18n="fixturesInfo"></div>
                </a>
            </div>

            <div class="col-12">
                <a href="history.html" class="menu-link d-flex text-decoration-none">
                    <div class="col-4 col-md-3 d-flex align-items-center menu-label" data-i18n="navbar.history"></div>
                    <div class="col-8 col-md-9 card bg-dark text-light p-3 menu-desc" data-i18n="historyInfo"></div>
                </a>
            </div>

            <div class="col-12">
                <a href="results.html" class="menu-link d-flex text-decoration-none">
                    <div class="col-4 col-md-3 d-flex align-items-center  menu-label" data-i18n="navbar.results">Wyniki</div>
                    <div class="col-8 col-md-9 card bg-dark text-light p-3 menu-desc" data-i18n="resultsInfo"></div>
                </a>
            </div>

            <div class="col-12">
                <a href="tournaments.html" class="menu-link d-flex text-decoration-none">
                    <div class="col-4 col-md-3 d-flex align-items-center menu-label" data-i18n="navbar.tournaments"></div>
                    <div class="col-8 col-md-9 card bg-dark text-light p-3 menu-desc" data-i18n="tournamentsInfo"></div>
                </a>
            </div>

            <div class="col-12">
                <a href="stats.html" class="menu-link d-flex text-decoration-none">
                    <div class="col-4 col-md-3 d-flex align-items-center menu-label" data-i18n="navbar.stats">Galeria</div>
                    <div class="col-8 col-md-9 card bg-dark text-light p-3 menu-desc" data-i18n="statsInfo"></div>
                </a>
            </div>

            <div class="col-12">
                <a href="gallery.html" class="menu-link d-flex text-decoration-none">
                    <div class="col-4 col-md-3 d-flex align-items-center menu-label" data-i18n="navbar.gallery">Galeria</div>
                    <div class="col-8 col-md-9 card bg-dark text-light p-3 menu-desc" data-i18n="galleryInfo"></div>
                </a>
            </div>
        </div>
    </main>

{{>footer}}

{{>search-modal}}
</body>
</html>
